[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "caseware-incremental-sync"
version = "0.1.0"
description = "Incremental sync + data sharing prototype (Postgres -> lake/share/events) with composite-watermark checkpointing and crash-consistent commits."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Caseware Take-Home Candidate" }]
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "psycopg[binary]>=3.1.18",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.4",
    "mypy>=1.10",
    "types-psycopg2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/caseware_sync"]

[tool.hatch.build.targets.sdist]
include = ["src/caseware_sync"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501"]  # long lines tolerated in tests / SQL strings

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"
markers = [
    "integration: tests that need the dockerized Postgres instance",
]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
